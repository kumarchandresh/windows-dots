# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
upgrade:
  source: "cdn"
  interval: "168h"
  auto: false
  notice: true
version: 3
# https://github.com/sindresorhus/pure
# TODO:
# - Show username and host when in an SSH session or a container.
# - Apply Catppuccin colors. https://catppuccin.com/palette/ https://ohmyposh.dev/docs/themes#catppuccin
blocks:
  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: path
        style: plain
        foreground: blue
        template: "{{.Path}}"
        properties:
          style: full
      - type: git
        style: plain
        foreground: '#6c6c6c'
        template: " {{.HEAD}}{{if .Staging.Changed}}<green>*</>{{else if .Working.Changed}}<#ffafdf>*</>{{end
          }}{{if or (gt .Behind 0) (gt .Ahead 0)}} {{end
          }}{{if gt .Behind 0}}<cyan>\u21e3</>{{end
          }}{{if gt .Ahead  0}}<cyan>\u21e1</>{{end
          }}{{if gt .StashCount 0}} <cyan>\u2261</>{{end
          }}"
        properties:
          source: pwsh
          fetch_status: true
          branch_icon: "\ue0a0 "
          commit_icon: "\uf417 "
      - type: executiontime
        style: plain
        foreground: yellow
        properties:
          threshold: 1000
          style: round
  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: text
        style: plain
        foreground_templates:
          - "{{if eq .Code 0}}magenta{{else}}red{{end}}"
        template: "\u276f "
secondary_prompt:
  template: "\u2026 "
  foreground: '#6c6c6c'